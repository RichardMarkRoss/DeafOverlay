<!doctype html>
<!--
  Source for the MSIX/Store logo PNGs: the website's "HWS" circle mark, in embedded Geist.
  Regenerated by build-msix.ps1 -Assets (headless Chrome renders this page at each size).
  #w=150&h=150&kind=mark   square mark
  #w=310&h=150&kind=wide   mark + "Heroes Without Sound"
-->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Geist"; font-weight: 600; src: url("../../crates/app/fonts/Geist-SemiBold.ttf"); }
html, body { margin: 0; background: transparent; }
body { display: grid; place-items: center; width: 100vw; height: 100vh; font-family: "Geist", sans-serif; color: #fff; }
.row { display: flex; align-items: center; gap: calc(var(--s) * 0.16); }
.mark {
  width: var(--s); height: var(--s); border-radius: 50%; box-sizing: border-box;
  background: #0a0a0a; border: calc(var(--s) * 0.035) solid rgba(255, 255, 255, 0.85);
  display: grid; place-items: center; position: relative;
  font-weight: 600; font-size: calc(var(--s) * 0.27); letter-spacing: 0.06em; padding-left: 0.06em;
}
/* one orange sound arc, the brand accent */
.mark::after {
  content: ""; position: absolute; inset: calc(var(--s) * 0.09); border-radius: 50%;
  border: calc(var(--s) * 0.035) solid transparent; border-top-color: #f97316;
  transform: rotate(35deg);
}
/* wide tile: the website's dark nav-bar pill behind mark + name, so it reads on light Start too */
.pill { background: #0a0a0a; border: calc(var(--s) * 0.02) solid rgba(255, 255, 255, 0.12);
  border-radius: calc(var(--s) * 0.3); padding: calc(var(--s) * 0.12) calc(var(--s) * 0.3) calc(var(--s) * 0.12) calc(var(--s) * 0.12); }
.name { font-weight: 600; font-size: calc(var(--s) * 0.17); letter-spacing: 0.22em; line-height: 1.35; text-transform: uppercase; color: #e5e7eb; }
</style></head>
<body>
<div class="row" id="root"></div>
<script>
const p = new URLSearchParams(location.hash.slice(1));
const w = +p.get("w") || 150, h = +p.get("h") || 150, kind = p.get("kind") || "mark";
const s = Math.round(Math.min(w, h) * (kind === "wide" ? 0.5 : 0.92));
document.documentElement.style.setProperty("--s", s + "px");
if (kind === "wide") document.getElementById("root").classList.add("pill");
document.getElementById("root").innerHTML = kind === "wide"
  ? '<div class="mark">HWS</div><div class="name">Heroes<br>Without<br>Sound</div>'
  : '<div class="mark">HWS</div>';
</script>
</body></html>
